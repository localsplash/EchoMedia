server {
    listen 80;
    server_name media.echo.wisp.net;
    root /media;

    # Disable directory listings
    autoindex off;

    # Max body size (not needed for serving, but safe default)
    client_max_body_size 0;

    location / {
        # CORS — allow any origin (media is not sensitive)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        # Cache static media files for 24 hours
        add_header Cache-Control "public, max-age=86400";

        # Proper MIME type detection
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        try_files $uri =404;
    }

    # Health check for monitoring
    location = /healthz {
        access_log off;
        return 200 '{"ok":true,"service":"EchoMedia"}';
        add_header Content-Type application/json;
    }
}
