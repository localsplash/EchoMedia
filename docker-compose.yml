# Standalone dev — for full stack use EchoOrchestrator instead.
services:
  echo-media:
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:?Export Git HEAD before building}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?Export Git committer epoch before building}
        BUILD_DIRTY: ${BUILD_DIRTY:?Export Git dirty state before building}
    container_name: echo-media
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      PORT: "8082"
      MEDIA_ROOT: /media
    ports:
      - "127.0.0.1:18082:8082"
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped

volumes:
  echo_media_data:
